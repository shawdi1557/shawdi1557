        <animateTransform attributeName="transform" type="translate" from="0 46" to="0 0" begin="0.65s" dur="0.6s" calcMode="spline" keySplines="0.2 0.9 0.3 1" keyTimes="0;1" fill="freeze"/>
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0;0 0" keyTimes="0;0.06;0.12;1" begin="3.25s" dur="6s" repeatCount="indefinite"/>
