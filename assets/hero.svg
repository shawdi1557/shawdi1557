        <animateTransform attributeName="transform" type="translate" from="0 46" to="0 0" begin="0.47s" dur="0.6s" calcMode="spline" keySplines="0.2 0.9 0.3 1" keyTimes="0;1" fill="freeze"/>
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0;0 0" keyTimes="0;0.06;0.12;1" begin="3.07s" dur="6s" repeatCount="indefinite"/>
          <text x="364" y="150" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',Menlo,Consolas,monospace" font-size="84" font-weight="800" fill="url(#name)">H</text>
        </g>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="0.56s" dur="0.5s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 46" to="0 0" begin="0.56s" dur="0.6s" calcMode="spline" keySplines="0.2 0.9 0.3 1" keyTimes="0;1" fill="freeze"/>
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0;0 0" keyTimes="0;0.06;0.12;1" begin="3.16s" dur="6s" repeatCount="indefinite"/>
          <text x="432" y="150" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',Menlo,Consolas,monospace" font-size="84" font-weight="800" fill="url(#name)">A</text>
        </g>
      </g>
      <g opacity="0">
