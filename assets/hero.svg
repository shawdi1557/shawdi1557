        <animateTransform attributeName="transform" type="translate" from="0 46" to="0 0" begin="1.10s" dur="0.6s" calcMode="spline" keySplines="0.2 0.9 0.3 1" keyTimes="0;1" fill="freeze"/>
        <g>
