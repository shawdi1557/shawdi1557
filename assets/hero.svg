        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0;0 0" keyTimes="0;0.06;0.12;1" begin="3.43s" dur="6s" repeatCount="indefinite"/>
          <text x="636" y="150" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',Menlo,Consolas,monospace" font-size="84" font-weight="800" fill="url(#name)">B</text>
        </g>
      </g>
      <g opacity="0">
