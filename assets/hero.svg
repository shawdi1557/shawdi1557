<line x1="300" y1="188" x2="700" y2="188" stroke="url(#name)" stroke-width="3" stroke-linecap="round" stroke-dasharray="400" stroke-dashoffset="400">
      <animate attributeName="stroke-dashoffset" from="400" to="0" begin="0.6s" dur="1.6s" fill="freeze"/>
    </line>

    <!-- travelling border light -->
    <rect x="1.5" y="1.5" width="997" height="247" rx="24" fill="none" stroke="url(#name)" stroke-width="2" stroke-opacity="0.75" stroke-dasharray="180 2267">
      <animate attributeName="stroke-dashoffset" from="0" to="-2447" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="0.5" y="0.5" width="999" height="249" rx="24" fill="none" stroke="#30363d"/>
  </g>
</svg>
