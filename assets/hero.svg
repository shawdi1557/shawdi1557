<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">AKSHAY BIJU</title>
  <desc id="d">Animated developer banner with an animated gradient name and a pulsing status indicator</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#010409"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="400" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#39ff14"/>
      <stop offset="0.5" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#39ff14"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="400 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="orbG"><stop offset="0" stop-color="#39ff14" stop-opacity="0.28"/><stop offset="1" stop-color="#39ff14" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbC"><stop offset="0" stop-color="#00e5ff" stop-opacity="0.24"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#39ff14" stroke-opacity="0.06"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="250" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="250" fill="url(#bg)"/>
    <rect width="1000" height="250" fill="url(#grid)"/>

    <circle cx="170" cy="60" r="220" fill="url(#orbG)">
      <animateTransform attributeName="transform" type="translate" values="0 0;140 50;0 0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="220" r="240" fill="url(#orbC)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-150 -40;0 0" dur="14s" repeatCount="indefinite"/>
    </circle>

    <g font-family="ui-monospace,'Fira Code',Menlo,Consolas,monospace" font-size="22" fill="#39ff14">
      <text x="70" y="70" opacity="0.2">&lt;/&gt;<animate attributeName="opacity" values="0.1;0.35;0.1" dur="4s" repeatCount="indefinite"/></text>
      <text x="890" y="190" opacity="0.2">{ }<animate attributeName="opacity" values="0.35;0.1;0.35" dur="5s" repeatCount="indefinite"/></text>
      <text x="90" y="210" opacity="0.2" fill="#00e5ff">01<animate attributeName="opacity" values="0.1;0.3;0.1" dur="3.5s" repeatCount="indefinite"/></text>
      <text x="880" y="70" opacity="0.2" fill="#00e5ff">;<animate attributeName="opacity" values="0.3;0.1;0.3" dur="4.5s" repeatCount="indefinite"/></text>
    </g>

    <!-- status pill with pulsing indicator -->
    <g>
      <rect x="325" y="30" width="350" height="34" rx="17" fill="#39ff14" fill-opacity="0.07" stroke="#39ff14" stroke-opacity="0.45"/>
      <circle cx="350" cy="47" r="5" fill="#39ff14"/>
      <circle cx="350" cy="47" r="5" fill="none" stroke="#39ff14">
        <animate attributeName="r" values="5;15" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="368" y="52" font-family="ui-monospace,'Fira Code',Menlo,Consolas,monospace" font-size="13" fill="#c9d1d9" textLength="292" lengthAdjust="spacing">SOFTWARE DEVELOPER @ MINTS GLOBAL</text>
    </g>

    <!-- name: letters rise in one by one, then a soft wave passes through every few seconds -->
    <g>
      <g opacity="0">
