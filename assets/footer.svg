<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Thanks for stopping by! Keep building. Keep learning. Keep shipping.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="400" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#39ff14"/>
      <stop offset="0.5" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#39ff14"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="400 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1000" height="340" rx="24"/></clipPath>
    <clipPath id="cmd">
      <rect x="338" y="0" width="0" height="340">
        <animate attributeName="width" calcMode="discrete"
          values="0;11;22;33;44;55;66;77;88;99;110;121;132;143;154;165;176;187;198;209;220;0"
          keyTimes="0;0.03;0.06;0.09;0.12;0.15;0.18;0.21;0.24;0.27;0.30;0.33;0.36;0.39;0.42;0.45;0.48;0.51;0.54;0.57;0.60;0.94" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="340" fill="url(#bg)"/>

    <!-- floating code glyphs -->
    <g font-family="ui-monospace,'Fira Code',Menlo,Consolas,monospace" font-size="24" fill="#39ff14" opacity="0.25">
      <text x="110" y="90">{ }<animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="5s" repeatCount="indefinite"/></text>
      <text x="850" y="120" fill="#00e5ff">&lt;/&gt;<animateTransform attributeName="transform" type="translate" values="0 -10;0 6;0 -10" dur="6s" repeatCount="indefinite"/></text>
      <text x="170" y="200" fill="#00e5ff">01<animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="7s" repeatCount="indefinite"/></text>
      <text x="800" y="210">;<animateTransform attributeName="transform" type="translate" values="0 -6;0 8;0 -6" dur="4.5s" repeatCount="indefinite"/></text>
    </g>

    <!-- messages -->
    <g filter="url(#glow)">
      <text x="500" y="88" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="800" fill="url(#g)" opacity="0">Thanks for stopping by!
        <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
      </text>
    </g>
    <text x="500" y="130" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#c9d1d9" opacity="0">Keep building. Keep learning. Keep shipping.
      <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="1s" fill="freeze"/>
    </text>

    <!-- terminal -->
    <g>
      <rect x="290" y="160" width="420" height="58" rx="12" fill="#0d1117" stroke="#30363d"/>
      <circle cx="312" cy="176" r="4.5" fill="#ff5f56"/>
      <circle cx="328" cy="176" r="4.5" fill="#ffbd2e"/>
      <circle cx="344" cy="176" r="4.5" fill="#27c93f"/>
      <g font-family="ui-monospace,'Fira Code',Menlo,Consolas,monospace" font-size="18">
        <text x="312" y="204" fill="#00e5ff">$</text>
        <text x="338" y="204" fill="#39ff14" textLength="242" lengthAdjust="spacing" clip-path="url(#cmd)">git push origin main</text>
        <rect y="188" width="9" height="20" fill="#39ff14">
          <animate attributeName="x" calcMode="discrete"
            values="338;349;360;371;382;393;404;415;426;437;448;459;470;481;492;503;514;525;536;547;558;338"
            keyTimes="0;0.03;0.06;0.09;0.12;0.15;0.18;0.21;0.24;0.27;0.30;0.33;0.36;0.39;0.42;0.45;0.48;0.51;0.54;0.57;0.60;0.94" dur="8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="0.9s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- waves -->
    <path d="M-250 290 Q-187.5 262 -125 290 T0 290 T125 290 T250 290 T375 290 T500 290 T625 290 T750 290 T875 290 T1000 290 T1125 290 T1250 290 V340 H-250 Z" fill="#39ff14" fill-opacity="0.10">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="250 0" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M-250 302 Q-187.5 280 -125 302 T0 302 T125 302 T250 302 T375 302 T500 302 T625 302 T750 302 T875 302 T1000 302 T1125 302 T1250 302 V340 H-250 Z" fill="#00e5ff" fill-opacity="0.10">
      <animateTransform attributeName="transform" type="translate" from="250 0" to="0 0" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M-250 316 Q-187.5 300 -125 316 T0 316 T125 316 T250 316 T375 316 T500 316 T625 316 T750 316 T875 316 T1000 316 T1125 316 T1250 316 V340 H-250 Z" fill="#39ff14" fill-opacity="0.14">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="250 0" dur="13s" repeatCount="indefinite"/>
    </path>

    <rect x="0.5" y="0.5" width="999" height="339" rx="24" fill="none" stroke="#30363d"/>
  </g>
</svg>
