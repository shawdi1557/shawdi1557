<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 10" width="1000" height="10" role="img" aria-label="Animated glowing divider line" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39ff14" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#39ff14"/>
      <stop offset="0.6" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-10%" y="-400%" width="120%" height="900%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect x="0" y="4" width="1000" height="2" rx="1" fill="#30363d"/>
  <rect x="-300" y="3" width="300" height="4" rx="2" fill="url(#pulse)" filter="url(#blur)">
    <animate attributeName="x" from="-300" to="1000" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="-300" y="4" width="300" height="2" rx="1" fill="url(#pulse)">
    <animate attributeName="x" from="-300" to="1000" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
