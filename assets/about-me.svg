<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 90" width="600" height="90" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">About Me</title>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#39ff14"/>
      <stop offset="0.5" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#39ff14"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="300 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="type">
      <rect x="194" y="0" width="0" height="90">
        <animate attributeName="width" calcMode="discrete"
          values="0;26;53;79;106;132;159;185;212;0"
          keyTimes="0;0.05;0.1;0.15;0.2;0.25;0.3;0.35;0.4;0.92" dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g filter="url(#glow)">
    <text x="194" y="62" font-family="ui-monospace,'Fira Code',Menlo,Consolas,monospace" font-size="44" font-weight="700" fill="url(#g)" textLength="212" lengthAdjust="spacing" clip-path="url(#type)">About Me</text>
  </g>

  <!-- cursor -->
  <rect y="24" width="4" height="46" rx="1" fill="#39ff14">
    <animate attributeName="x" calcMode="discrete"
      values="194;220;247;273;300;326;353;379;406;194"
      keyTimes="0;0.05;0.1;0.15;0.2;0.25;0.3;0.35;0.4;0.92" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <rect x="194" y="76" width="212" height="3" rx="1.5" fill="url(#g)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
