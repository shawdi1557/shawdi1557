name: Generate Contribution Snake

on:
  # Refresh every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Run when the README or workflow changes on the default branch
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/snake.yml"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    name: Generate snake animation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare output folder
        run: mkdir -p output

      # Renders the contribution graph of the repo owner as an animated SVG
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            output/github-contribution-grid-snake.svg
            output/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=39ff14

      # Publishes the SVGs to a separate "output" branch so your main branch stays clean
      - name: Push to the output branch
        run: |
          cd output
          git init --quiet
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --quiet -b output
          git add .
          git commit --quiet -m "chore: update contribution snake"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
