name: Generate Contribution Snake

on:
  # Refresh every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Run when the README or workflow changes on the default branch
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/snake.yml"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

env:
  # The snake starts at 4 segments and gains one for every contribution it eats,
  # until it reaches this length. Change the number to make it shorter or longer.
  SNAKE_MAX_LENGTH: "20"
  # How many contributions it must eat to gain one segment (1 = every single contribution).
  SNAKE_GROW_EVERY: "3"

jobs:
  generate:
    name: Generate snake animation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare output folder
        run: mkdir -p output

      # ---- Growing snake: build Platane/snk from source with a small patch ----
      - name: Get snk source (pinned version)
        id: src
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Platane/snk
          ref: a041d6c27ba561a39f5be9c26a784812765e434b
          path: snk

      - name: Set up Bun
        id: bun
        continue-on-error: true
        uses: oven-sh/setup-bun@v2

      - name: Patch snk so the snake grows when it eats
        id: patch
        continue-on-error: true
        working-directory: snk/packages/svg-creator
        run: |
          set -e
          cat > snake.ts <<'EOF'
          import { getSnakeLength, snakeToCells } from "@snk/types/snake";
          import type { Snake } from "@snk/types/snake";
          import type { Point } from "@snk/types/point";
          import { h } from "./xml-utils";
          import { createAnimation } from "./css-utils";

          export type Options = {
            colorSnake: string;
            sizeCell: number;
            sizeDot: number;
          };

          const lerp = (k: number, a: number, b: number) => (1 - k) * a + k * b;

          // The snake gains one segment every time it eats a contribution, up to this length.
          const MAX_LENGTH = Number(process.env.SNAKE_MAX_LENGTH ?? 14);
          // Number of contributions the snake must eat to gain one segment (1 = every contribution).
          const GROW_EVERY = Math.max(1, Number(process.env.SNAKE_GROW_EVERY ?? 1));

          export const createSnake = (
            chain: Snake[],
            { sizeCell, sizeDot }: Options,
            duration: number,
            eatTimes: number[] = [],
          ) => {
            const snakeN = chain[0] ? getSnakeLength(chain[0]) : 0;

            const snakeParts: Point[][] = Array.from({ length: snakeN }, () => []);

            for (const snake of chain) {
              const cells = snakeToCells(snake);
              for (let i = cells.length; i--; ) snakeParts[i].push(cells[i]);
            }

            const svgElements = snakeParts.map((_, i, { length }) => {
              // compute snake part size
              const dMin = sizeDot * 0.8;
              const dMax = sizeCell * 0.9;
              const iMax = Math.min(4, length);
              const u = (1 - Math.min(i, iMax) / iMax) ** 2;
              const s = lerp(u, dMin, dMax);

              const m = (sizeCell - s) / 2;

              const r = Math.min(4.5, (4 * s) / sizeDot);

              return h("rect", {
                class: `s s${i}`,
                x: m.toFixed(1),
                y: m.toFixed(1),
                width: s.toFixed(1),
                height: s.toFixed(1),
                rx: r.toFixed(1),
                ry: r.toFixed(1),
              });
            });

            const transform = ({ x, y }: Point) =>
              `transform:translate(${x * sizeCell}px,${y * sizeCell}px)`;

            const styles = [
              `.s{ 
                shape-rendering: geometricPrecision;
                fill: var(--cs);
                animation: none linear ${duration}ms infinite
              }`,

              ...snakeParts.map((positions, i) => {
                const id = `s${i}`;
                const animationName = id;

                const keyframes = removeInterpolatedPositions(
                  positions.map((tr, i, { length }) => ({ ...tr, t: i / length })),
                ).map(({ t, ...p }) => ({ t, style: transform(p) }));

                return [
                  createAnimation(animationName, keyframes),

                  `.s.${id}{
                    ${transform(positions[0])};
                    animation-name: ${animationName}
                  }`,
                ];
              }),
            ].flat();

            // ---- growing body -------------------------------------------------------
            // Extra segment i follows the exact path of the head, i steps behind
            // (same keyframes as the head, delayed). It fades in the moment the snake
            // eats its (i - snakeN + 1)th group of GROW_EVERY contributions.
            const stepMs = duration / Math.max(1, chain.length);
            const extraN = Math.max(
              0,
              Math.min(MAX_LENGTH - snakeN, Math.floor(eatTimes.length / GROW_EVERY)),
            );
            const extraIdx = Array.from({ length: extraN }, (_, j) => snakeN + j);

            const extraElements = extraIdx.map((i) => {
              const s = sizeDot * 0.8;
              const m = (sizeCell - s) / 2;
              const r = Math.min(4.5, (4 * s) / sizeDot);
              return h("rect", {
                class: `s s${i}`,
                x: m.toFixed(1),
                y: m.toFixed(1),
                width: s.toFixed(1),
                height: s.toFixed(1),
                rx: r.toFixed(1),
                ry: r.toFixed(1),
              });
            });

            const extraStyles = extraIdx
              .map((i, j) => {
                const t = eatTimes[Math.min(eatTimes.length - 1, (j + 1) * GROW_EVERY - 1)];
                const b = Math.min(99.4, Math.max(0.002, t * 100));
                return [
                  `@keyframes g${i}{0%{opacity:0}${(b - 0.001).toFixed(3)}%{opacity:0}${b.toFixed(3)}%{opacity:1}99.5%{opacity:1}100%{opacity:0}}`,
                  `.s.s${i}{ ${transform(snakeParts[0][0])}; opacity: 0; animation-name: s0, g${i}; animation-delay: ${Math.round(i * stepMs)}ms, 0ms }`,
                ];
              })
              .flat();

            return {
              svgElements: [...svgElements, ...extraElements],
              styles: [...styles, ...extraStyles],
            };
          };

          const removeInterpolatedPositions = <T extends Point>(arr: T[]) =>
            arr.filter((u, i, arr) => {
              if (i - 1 < 0 || i + 1 >= arr.length) return true;

              const a = arr[i - 1];
              const b = arr[i + 1];

              const ex = (a.x + b.x) / 2;
              const ey = (a.y + b.y) / 2;

              // return true;
              return !(Math.abs(ex - u.x) < 0.01 && Math.abs(ey - u.y) < 0.01);
            });
          EOF
          python3 - <<'PY'
          p = "index.ts"
          s = open(p).read()
          old = "createSnake(chain, drawOptions, duration),"
          new = ("createSnake(chain, drawOptions, duration, "
                 "livingCells.filter((c) => c.t !== null)"
                 ".map((c) => c.t as number).sort((a, b) => a - b)),")
          assert s.count(old) == 1, "snk changed: patch target not found"
          open(p, "w").write(s.replace(old, new))
          PY

      - name: Install snk dependencies
        id: deps
        continue-on-error: true
        working-directory: snk
        run: bun install

      - name: Generate growing snake SVGs
        id: grow
        continue-on-error: true
        working-directory: snk
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bun packages/generate-snake-animation/cli.ts \
            --github_user="${{ github.repository_owner }}" \
            --output="../output/github-contribution-grid-snake.svg" \
            --output="../output/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=39ff14"

      # ---- Fallback: if anything above failed, use the standard fixed-length snake ----
      - name: Fallback to standard snake
        if: ${{ hashFiles('output/github-contribution-grid-snake-dark.svg') == '' }}
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            output/github-contribution-grid-snake.svg
            output/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=39ff14

      # ---- Contribution charts: animated bar graph + donut built from your real GitHub data ----
      - name: Generate contribution charts
        env:
          GH_TOKEN: ${{ github.token }}
          LOGIN: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import datetime
          import html
          import json
          import math
          import os
          import urllib.request

          LOGIN = os.environ["LOGIN"]
          TOKEN = os.environ["GH_TOKEN"]
          OUT = "output"

          GREEN, CYAN = "#39ff14", "#00e5ff"
          FONT = "'Segoe UI','Helvetica Neue',Arial,sans-serif"

          QUERY = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                totalCommitContributions
                totalIssueContributions
                totalPullRequestContributions
                totalPullRequestReviewContributions
                restrictedContributionsCount
                contributionCalendar {
                  totalContributions
                  weeks { contributionDays { date contributionCount } }
                }
              }
            }
          }
          """


          def load():
              req = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=json.dumps({"query": QUERY, "variables": {"login": LOGIN}}).encode(),
                  headers={
                      "Authorization": "bearer " + TOKEN,
                      "Content-Type": "application/json",
                      "User-Agent": "profile-readme-charts",
                  },
              )
              data = json.load(urllib.request.urlopen(req, timeout=60))
              user = (data.get("data") or {}).get("user")
              if not user:
                  raise SystemExit("GitHub API returned no user data: " + json.dumps(data)[:400])
              return user["contributionsCollection"]


          def nice_top(v):
              if v <= 0:
                  return 4, 1
              raw = v / 4
              mag = 10 ** math.floor(math.log10(raw)) if raw >= 1 else 1
              step = math.ceil(raw / mag) * mag
              return step * 4, step


          def bar_chart(col):
              cal = col["contributionCalendar"]
              months = {}
              for week in cal["weeks"]:
                  for day in week["contributionDays"]:
                      months[day["date"][:7]] = months.get(day["date"][:7], 0) + day["contributionCount"]
              keys = sorted(months)[-12:]
              vals = [months[k] for k in keys]
              labels = [datetime.datetime.strptime(k + "-01", "%Y-%m-%d").strftime("%b") for k in keys]

              W, H = 600, 312
              left, right, top, bottom = 48, 16, 72, 262
              ph = bottom - top
              top_val, step = nice_top(max(vals) if vals else 0)
              n = max(1, len(vals))
              slot = (W - left - right) / n
              bw = slot * 0.56
              peak = vals.index(max(vals)) if vals and max(vals) > 0 else -1

              o = []
              o.append(f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {W} {H}" width="{W}" height="{H}" role="img" aria-labelledby="t">')
              o.append(f'<title id="t">Contributions per month over the last year</title>')
              o.append(f'''<defs>
          <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{GREEN}"/><stop offset="1" stop-color="{CYAN}"/></linearGradient>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#010409"/></linearGradient>
          </defs>''')
              o.append(f'<rect x="0.5" y="0.5" width="{W-1}" height="{H-1}" rx="16" fill="url(#bg)" stroke="#30363d"/>')
              o.append(f'<text x="24" y="36" font-family="{FONT}" font-size="18" font-weight="700" fill="#e6edf3">Contributions per month</text>')
              o.append(f'<text x="24" y="56" font-family="{FONT}" font-size="12" fill="#8b949e">Last 12 months</text>')
              o.append(f'<text x="{W-24}" y="36" text-anchor="end" font-family="{FONT}" font-size="18" font-weight="700" fill="{GREEN}">{cal["totalContributions"]:,}</text>')
              o.append(f'<text x="{W-24}" y="56" text-anchor="end" font-family="{FONT}" font-size="12" fill="#8b949e">contributions in the last year</text>')

              for i in range(5):
                  y = bottom - ph * i / 4
                  o.append(f'<line x1="{left}" y1="{y:.1f}" x2="{W-right}" y2="{y:.1f}" stroke="#21262d" stroke-width="1"/>')
                  o.append(f'<text x="{left-8}" y="{y+4:.1f}" text-anchor="end" font-family="{FONT}" font-size="11" fill="#6e7681">{int(step*i):,}</text>')

              for i, (v, lab) in enumerate(zip(vals, labels)):
                  cx = left + slot * i + slot / 2
                  x = cx - bw / 2
                  h = max(2.0, ph * v / top_val) if top_val else 2.0
                  y = bottom - h
                  d = 0.15 + i * 0.09
                  fill = "url(#bar)" if v > 0 else "#30363d"
                  op = 1 if i == peak else 0.72
                  o.append(f'<rect x="{x:.1f}" y="{bottom}" width="{bw:.1f}" height="0" rx="4" fill="{fill}" opacity="{op}">'
                           f'<animate attributeName="height" from="0" to="{h:.1f}" begin="{d:.2f}s" dur="0.8s" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1" fill="freeze"/>'
                           f'<animate attributeName="y" from="{bottom}" to="{y:.1f}" begin="{d:.2f}s" dur="0.8s" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1" fill="freeze"/>'
                           + (f'<animate attributeName="opacity" values="1;0.75;1" dur="3s" begin="{d+1:.2f}s" repeatCount="indefinite"/>' if i == peak else '')
                           + '</rect>')
                  o.append(f'<text x="{cx:.1f}" y="{y-7:.1f}" text-anchor="middle" font-family="{FONT}" font-size="11" font-weight="600" fill="{GREEN if i == peak else "#c9d1d9"}" opacity="0">{v:,}'
                           f'<animate attributeName="opacity" from="0" to="1" begin="{d+0.6:.2f}s" dur="0.4s" fill="freeze"/></text>')
                  o.append(f'<text x="{cx:.1f}" y="{bottom+20}" text-anchor="middle" font-family="{FONT}" font-size="12" fill="#8b949e">{html.escape(lab)}</text>')

              o.append(f'<text x="{W-24}" y="{H-8}" text-anchor="end" font-family="{FONT}" font-size="10" fill="#6e7681">Updated {datetime.date.today().isoformat()}</text>')
              o.append('</svg>')
              return "\n".join(o)


          def donut_chart(col):
              items = [
                  ("Commits", col["totalCommitContributions"], GREEN),
                  ("Pull requests", col["totalPullRequestContributions"], CYAN),
                  ("Code reviews", col["totalPullRequestReviewContributions"], "#7c9cff"),
                  ("Issues", col["totalIssueContributions"], "#f2cc60"),
                  ("Private / other", col["restrictedContributionsCount"], "#8b949e"),
              ]
              total = sum(v for _, v, _ in items)
              W, H = 600, 312
              cx, cy, r, sw = 150, 184, 82, 28
              C = 2 * math.pi * r

              o = []
              o.append(f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {W} {H}" width="{W}" height="{H}" role="img" aria-labelledby="t">')
              o.append('<title id="t">Breakdown of my GitHub contributions by type</title>')
              o.append('<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#010409"/></linearGradient></defs>')
              o.append(f'<rect x="0.5" y="0.5" width="{W-1}" height="{H-1}" rx="16" fill="url(#bg)" stroke="#30363d"/>')
              o.append(f'<text x="24" y="36" font-family="{FONT}" font-size="18" font-weight="700" fill="#e6edf3">Contribution breakdown</text>')
              o.append(f'<text x="24" y="56" font-family="{FONT}" font-size="12" fill="#8b949e">By type, last 12 months</text>')
              o.append(f'<circle cx="{cx}" cy="{cy}" r="{r}" fill="none" stroke="#21262d" stroke-width="{sw}"/>')

              shown = [(l, v, c) for l, v, c in items if v > 0]
              gap = 3 if len(shown) > 1 else 0
              start = 0.0
              for idx, (label, v, color) in enumerate(shown):
                  frac = v / total
                  length = max(0.5, frac * C - gap)
                  off = -(start * C + gap / 2)
                  d = 0.2 + idx * 0.35
                  o.append(f'<circle cx="{cx}" cy="{cy}" r="{r}" fill="none" stroke="{color}" stroke-width="{sw}" '
                           f'stroke-dasharray="0 {C:.2f}" stroke-dashoffset="{off:.2f}" transform="rotate(-90 {cx} {cy})">'
                           f'<animate attributeName="stroke-dasharray" from="0 {C:.2f}" to="{length:.2f} {C-length:.2f}" begin="{d:.2f}s" dur="0.7s" fill="freeze"/></circle>')
                  start += frac

              o.append(f'<text x="{cx}" y="{cy+6}" text-anchor="middle" font-family="{FONT}" font-size="28" font-weight="700" fill="#e6edf3">{total:,}</text>')
              o.append(f'<text x="{cx}" y="{cy+26}" text-anchor="middle" font-family="{FONT}" font-size="12" fill="#8b949e">contributions</text>')

              for i, (label, v, color) in enumerate(items):
                  y = 118 + i * 36
                  pct = ("<1%" if 0 < v / total < 0.005 else f"{v / total * 100:.0f}%") if total else "0%"
                  o.append(f'<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="{0.4 + i * 0.2:.2f}s" dur="0.5s" fill="freeze"/>'
                           f'<rect x="300" y="{y-12}" width="14" height="14" rx="4" fill="{color}"/>'
                           f'<text x="324" y="{y}" font-family="{FONT}" font-size="15" fill="#c9d1d9">{html.escape(label)}</text>'
                           f'<text x="{W-84}" y="{y}" text-anchor="end" font-family="{FONT}" font-size="15" font-weight="600" fill="#e6edf3">{v:,}</text>'
                           f'<text x="{W-24}" y="{y}" text-anchor="end" font-family="{FONT}" font-size="13" fill="#8b949e">{html.escape(pct)}</text></g>')

              o.append(f'<text x="{W-24}" y="{H-8}" text-anchor="end" font-family="{FONT}" font-size="10" fill="#6e7681">Updated {datetime.date.today().isoformat()}</text>')
              o.append('</svg>')
              return "\n".join(o)


          def main(load_fn=load):
              col = load_fn()
              os.makedirs(OUT, exist_ok=True)
              with open(os.path.join(OUT, "contribution-bars.svg"), "w") as f:
                  f.write(bar_chart(col))
              with open(os.path.join(OUT, "contribution-donut.svg"), "w") as f:
                  f.write(donut_chart(col))
              print("charts written:", col["contributionCalendar"]["totalContributions"], "contributions")


          if __name__ == "__main__":
              main()
          PY

      # Publishes the SVGs to a separate "output" branch so your main branch stays clean
      - name: Push to the output branch
        run: |
          cd output
          git init --quiet
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --quiet -b output
          git add .
          git commit --quiet -m "chore: update contribution snake"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
